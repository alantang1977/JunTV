name: Release from commit messages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          update-environment: true
          cache: 'pipenv'

      - name: Install dependencies with pipenv
        shell: bash
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv --python 3.14
          pipenv install --dev

      - name: Build the primary GUI application
        run: pipenv run ui_build

      - name: Read version info
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          with open("version.json", encoding="utf-8") as file:
              info = json.load(file)
          if not info.get("name") or not info.get("version"):
              raise SystemExit("version.json must contain name and version")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write(f"name={info['name']}\nversion={info['version']}\n")
          PY

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "dist\$env:name-GUI-v$env:version"
          if (-not (Test-Path $bundle)) {
            Write-Error "Windows application directory not found: $bundle"
            exit 1
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $asset = "$env:name-GUI-Windows-$env:RUNNER_ARCH-v$env:version.zip"
          Compress-Archive -Path $bundle -DestinationPath (Join-Path $PWD "artifacts\$asset")

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="dist/${name}-GUI-v${version}.app"
          if [[ ! -d "$app_path" ]]; then
            echo "macOS application bundle not found: $app_path" >&2
            exit 1
          fi
          mkdir -p artifacts
          asset="${name}-GUI-macOS-${RUNNER_ARCH}-v${version}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "artifacts/$asset"

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}-${{ runner.arch }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download GUI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          path: release-assets
          merge-multiple: true

      - name: Read version info
        shell: pwsh
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          if (-not $json.name -or -not $json.version) {
            Write-Error 'version.json must contain name and version.'
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "name=$($json.name)"
          Add-Content -Path $env:GITHUB_ENV -Value "version=$($json.version)"
          Add-Content -Path $env:GITHUB_ENV -Value "release_tag=$($json.version)"
          Add-Content -Path $env:GITHUB_ENV -Value "release_title=v$($json.version)"

      - name: Validate release tag does not already exist
        shell: pwsh
        run: |
          $existingTag = git tag --list $env:release_tag
          if ($existingTag) {
            Write-Error "Tag '$env:release_tag' already exists. Bump version.json before releasing."
            exit 1
          }

      - name: Generate release notes from commit messages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionCommits = @(git log --format=%H -- version.json)
          $baseCommit = ''

          if ($versionCommits.Count -ge 2) {
            $baseCommit = $versionCommits[1].Trim()
          } elseif ($versionCommits.Count -eq 1) {
            $baseCommit = $versionCommits[0].Trim()
          }

          if (-not $baseCommit) {
            try {
              $baseCommit = (git describe --tags --abbrev=0).Trim()
            } catch {
              $baseCommit = ''
            }
          }

          if (-not $baseCommit) {
            $baseCommit = (git rev-list --max-parents=0 HEAD | Select-Object -First 1).Trim()
          }

          $rawMessages = git log --reverse --format=%s "$baseCommit..HEAD"
          $skipPatterns = @(
            '^(?i)release:\s*v?\d',
            '^(?i)release\b',
            '^(?i)chore:\s*version\b',
            '^(?i)chore(?:\(.+\))?:\s*bump\s+version\b',
            '^(?i)bump\s+version\b',
            '^(?i)version\s+update\b',
            '^(?i)merge\s+pull\s+request\b',
            '^(?i)merge\b'
          )

          $notes = New-Object System.Collections.Generic.List[string]
          foreach ($line in $rawMessages) {
            $message = $line.Trim()
            if (-not $message) { continue }
            $skip = $false
            foreach ($pattern in $skipPatterns) {
              if ($message -match $pattern) {
                $skip = $true
                break
              }
            }
            if (-not $skip) {
              $notes.Add("- $message")
            }
          }

          if ($notes.Count -eq 0) {
            $notes.Add("Release $env:release_title")
          }
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "Release notes generated from base commit: $baseCommit"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem release-assets -Filter '*.zip' | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 2) {
            Write-Error "Expected two desktop assets, found $($assets.Count)."
            exit 1
          }
          $checksums = Join-Path $PWD 'release-assets/SHA256SUMS.txt'
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content -Path $checksums -Encoding utf8NoBOM
          gh release create $env:release_tag $assets $checksums --title $env:release_title --notes-file release-notes.md --target $env:GITHUB_SHA

      - name: Confirm release
        shell: pwsh
        run: Write-Host "Released version $env:version with Windows and macOS desktop assets."

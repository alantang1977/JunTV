# =============================================================================
# Update iptv直播源列表 - JunTV 仓库专用工作流
# -----------------------------------------------------------------------------
# 目标：让 JunTV（IPTV-API v3.x）在 GitHub Actions 中自动采集、测速并生成
#       直播源文件，然后**提交到仓库 output/ 目录**，
#       这样即可通过固定链接（如 raw.githubusercontent.com）直接播放。
#
# 相对原始版本的健壮性改进：
#   1. Python 3.14（JunTV Pipfile 要求）
#   2. JunTV 代码中无 open_driver / selenium，故不装 Chrome/chromedriver/selenium
#   3. permissions: contents: write、fetch-depth: 0、pipenv 的 ~/.local/bin PATH
#      修复、mkdir -p output、Artifact 备份、git push 不使用 --force
#   4. 运行时移除 .gitignore 中对 /output/ 的忽略规则，使生成文件可被提交
#
# 本次新增修复（对应 Actions #868 的失败）：
#   A. push 前先 `git pull --rebase --autostash`：运行一次约 25 分钟，期间若
#      main 被人手动推送过（本次就是手动提交 ad19bdc "Update subscribe.txt"
#      导致远端超前），不再因 non-fast-forward 被拒，而是把自动提交变基到
#      远端最新之上再推送（fast-forward）。
#   B. 提交前还原 config/subscribe.txt：该文件是你手动维护的源订阅列表，
#      bot 运行时虽会改写它，但**不再把它的改动提交进去**，从而保留你的
#      手动编辑，也避免与 bot 的自动提交互相冲突。
#   C. 忽略 output/data/（对应第二次失败）：测速数据库 channel_results.db
#      达 102.76 MB，超过 GitHub 100 MB 单文件上限被 GH001 拒收，
#      运行时把 output/data/ 写进 .gitignore，只提交直播源产物。
# =============================================================================
name: 'Update iptv直播源列表'

on:
  schedule:
    - cron: '55 0 */2 * *'  # 每2天凌晨00点55分执行任务（UTC时间，对应北京时间08:55）
  workflow_dispatch:
    branches:
      - main
      - dev
      - gd

# 授予工作流仓库写入权限，确保能推送更新结果
permissions:
  contents: write

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'main' }}" >> $GITHUB_ENV

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0  # 拉取完整git历史，避免commit异常

      - name: Run with setup-python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          update-environment: true
          cache: 'pipenv'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipenv
        run: |
          pip3 install --user pipenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH  # 修复~/.local/bin不在PATH导致pipenv找不到

      - name: Ensure output directory exist
        run: mkdir -p output

      # JunTV 默认在 .gitignore 中忽略 /output/（官方只上传Artifact不提交）。
      # 本工作流的目标是把直播源文件提交到仓库 output/ 目录，
      # 因此移除该忽略规则（幂等：规则不存在时无任何影响）。
      # 另外：output/data/ 是运行时测速数据库（channel_results.db，实测
      # 102.76 MB，超过 GitHub 单文件 100 MB 硬上限，push 会被 GH001 拒绝），
      # 这里永久忽略它，只提交真正的直播源产物。
      - name: Ensure output directory is tracked
        run: |
          sed -i '\#^/output/$#d' .gitignore
          grep -qxF 'output/data/' .gitignore || echo 'output/data/' >> .gitignore

      - name: Install dependencies
        run: pipenv --python 3.14 && pipenv install --deploy

      - name: Update
        run: pipenv run dev

      - name: Debug‑Print generated files
        run: |
          ls -la
          ls -la ./output || true

      - name: Upload generated output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-live-files
          path: ./output
          if-no-files-found: warn

      - name: Commit and push if changed
        run: |
          set -x
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # [修复B] config/subscribe.txt 是手动维护的源订阅列表。
          # bot 运行时可能改写它，但这里把它还原成仓库里已提交的版本，
          # 不纳入本次自动提交，从而保留手动编辑、避免冲突。
          git restore config/subscribe.txt 2>/dev/null || true

          # [修复C] output/data/channel_results.db 早已被 git 跟踪入库（约92MB），
          # 每次重新生成会涨到 ~102MB，超过 GitHub 100MB 单文件上限，被 GH001 拒收。
          # .gitignore 对已跟踪文件无效，因此必须：
          #   1) 写入 .gitignore 永久忽略；
          #   2) git rm --cached 把它从跟踪中移除（只删索引，保留工作区文件）。
          # 本次提交只包含"删除该 db"，不引入新的超大 blob，push 即可通过。
          grep -qxF 'output/data/' .gitignore || echo 'output/data/' >> .gitignore
          git rm -r --cached output/data/ 2>/dev/null || true

          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            # [修复A] 运行期间 main 可能已被手动推送（约25分钟窗口），
            # 先变基到远端最新，再以 fast-forward 推送，避免 non-fast-forward 被拒。
            git pull --rebase --autostash origin "${{ env.BRANCH_NAME }}"
            git push origin "${{ env.BRANCH_NAME }}"
          fi

name: Sync Upstream Release

on:
  schedule:
    - cron: '0 4 * * *'  # 每天检测一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 获取上游最新 Release
        id: upstream
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'Guovin',
              repo: 'iptv-api'
            });
            return {
              tag: release.tag_name,
              name: release.name,
              body: release.body,
              assets: release.assets.map(a => ({ name: a.name, url: a.browser_download_url }))
            };

      - name: 检查本地是否已存在
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.upstream.outputs.result }}'.match(/"tag":"([^"]+)"/)[1];
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              return true;
            } catch (e) {
              if (e.status === 404) return false;
              throw e;
            }

      - name: 下载上游资产
        if: steps.check.outputs.result == 'false'
        run: |
          mkdir -p assets
          echo '${{ steps.upstream.outputs.result }}' | python -c "
          import sys, json, urllib.request
          data = json.load(sys.stdin)
          for asset in data['assets']:
              print(f'下载 {asset[\"name\"]}')
              urllib.request.urlretrieve(asset['url'], f'assets/{asset[\"name\"]}')
          "

      - name: 发布到本仓库
        if: steps.check.outputs.result == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ fromJson(steps.upstream.outputs.result).tag }}
          name: ${{ fromJson(steps.upstream.outputs.result).name }}
          body: ${{ fromJson(steps.upstream.outputs.result).body }}
          files: assets/*

name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pipenv

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv sync --dev

      - name: Verify dependency lock
        run: pipenv verify

      - name: Run unit tests
        run: pipenv run python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: pipenv run python -m compileall -q main.py service updates utils desktop_ui tests

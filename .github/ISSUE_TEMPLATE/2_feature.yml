name: Feature request | 功能建议
description: Suggest an improvement or new feature | 提议功能改进或新增功能
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        欢迎提交功能建议。

        建议尽量说明你想解决的问题，而不仅仅是描述一个功能名称。
        这有助于维护者判断需求场景和实现方式。

        Feature requests are welcome.

        Please describe the problem and use case, not only the feature name.

  - type: checkboxes
    id: precheck
    attributes:
      label: Submission checklist | 提交前确认
      description: Please confirm the following before submitting | 提交前请确认以下内容
      options:
        - label: I have searched existing issues and discussions for similar suggestions | 我已经搜索过类似的 Issue 和 Discussions
          required: true
        - label: This suggestion is related to this project | 这个建议与本项目相关
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Category | 建议类别
      description: Select the category that best matches your suggestion | 选择最符合建议内容的类别
      options:
        - Data sources or channels | 数据源或频道
        - Filtering or parsing | 过滤或解析
        - GUI | 软件界面
        - Command line or API | 命令行或 API
        - Docker or deployment | Docker 或部署
        - GitHub Actions / Workflow | GitHub 工作流
        - Performance or stability | 性能或稳定性
        - Documentation | 文档
        - Other | 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation | 背景与问题
      description: What problem would this suggestion solve? | 这个建议想解决什么问题
      placeholder: 请描述当前遇到的问题、使用场景，以及为什么这个问题值得解决
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution | 建议方案
      description: Describe the feature or improvement you would like | 描述你希望增加或改进的内容
      placeholder: |
        请描述理想的功能表现，必要时可以提供示例配置、命令或界面效果
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered | 其他方案
      description: Describe alternative solutions or workarounds you have considered | 描述你考虑过的其他方案或临时解决方法
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: Use case and additional context | 使用场景与补充信息
      description: Add examples, screenshots, links, or other context | 可补充示例、截图、链接等信息
    validations:
      required: false
